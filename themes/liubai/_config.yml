# ============================================================================
# 留白 (liubai) — 中式简约主题配置
# 站点级配置在 Hexo 的 _config.yml，这里只放主题自己的东西
# ============================================================================

# ---------------------------------------------------------------------------
# 顶部导航
# 默认隐藏，鼠标靠近屏幕顶部时滑出；滚动后自动固定
# ---------------------------------------------------------------------------
nav:
  # 鼠标进入顶部多少像素内触发（px）
  hover_zone: 90
  # 滚动超过多少像素后导航常驻（px），设为 0 表示只在悬停时出现
  pin_after: 260
  # 导航右侧显示的小字
  meta: ''
  # 菜单项：name 显示名 / url 地址 / en 英文小字（可选，做双语排版用）
  menu:
    - name: 首页
      url: /
      en: INDEX
    - name: 友人帐
      url: /links/
      en: LINKS
    - name: 留言板
      url: /comment/
      en: GUESTBOOK
    - name: 关于
      url: /about/
      en: ABOUT

# ---------------------------------------------------------------------------
# 首屏
# ---------------------------------------------------------------------------
hero:
  # 首屏高度（CSS 长度）。留白风建议 62vh ~ 78vh
  height: 66vh
  # 底图，留空则用纯色宣纸底
  image: /img/chun3.webp
  # 压暗程度 0 ~ 1，图片亮的时候调高
  scrim: 0.34
  # 标题下方的一句话
  tagline: 2026重置版
  # 竖排文字（中式元素）。留空则不显示
  vertical: 九〇一小世界
  # 左下角滚动提示文字
  scroll_hint: 向下

# ---------------------------------------------------------------------------
# 入场动画（点击后才能进入主页）
# 只在首页出现。风格：平面几何 + 终末地式 HUD 细线
# ---------------------------------------------------------------------------
intro:
  enable: true
  # 同一浏览器会话内只播一次（关掉 = 每次打开首页都播）
  once_per_session: true
  # 主标题，留空用站点标题
  title: ''
  # 中文副题，留空用站点副标题
  subtitle: ''
  # 罗马字副标（终末地 UI 常见的中英并置）
  latin: SINGNING901 / TALOS-II
  # 中间的大字，逐字入场；留空则不显示
  display: 山水
  # 提示文字与按钮上的拉丁小字
  prompt: 点击进入
  enter_label: ENTER
  # 下角状态行
  status_left: 九〇一 · 小世界
  status_right: SYSTEM READY
  # 强制固定时段（留空 = 按访客本地时间自动切换）
  # 可选：dawn / day / dusk / night，调试或想固定风格时用
  force_daypart: ''
  # 是否在入场层显示随时段变化的问候语
  greeting: true

# ---------------------------------------------------------------------------
# 首页链接卡片 —— 预留接口
# 想加/改卡片，只改这个列表即可，不用动模板
#   name  卡片标题（必填）
#   desc  一句话说明
#   url   跳转地址（必填）
#   img   配图路径，留空则显示纯色块 + 首字
#   tag   右上角小标签
# ---------------------------------------------------------------------------
cards:
  enable: true
  title: START:DASH!!
  subtitle: 正式上线！！！
  items:
    - name: Bilibili拜年纪
      desc: 春节快乐！
      url: https://live.bilibili.com/233
      img: /img/chun5.webp
      tag: 活动
    - name: Bilibili
      desc: 我的 b 站视频
      url: https://space.bilibili.com/293793694
      img: /img/bilibili.jpg
      tag: 视频
    - name: 高考加油
      desc: 不负韶华
      url: http://www.sxkszx.cn/index.html
      img: /img/gaokao.png
      tag: 加油

# ---------------------------------------------------------------------------
# 侧栏 / 作者
# ---------------------------------------------------------------------------
author:
  enable: true
  avatar: /img/niao.jpg
  name: Singning901
  bio: 901 的小世界是一个有意思的小窝

# ---------------------------------------------------------------------------
# 页脚
# ---------------------------------------------------------------------------
footer:
  since: 2021
  # 页脚第三列链接
  links:
    - name: GitHub
      url: https://github.com/singning901
    - name: Bilibili
      url: https://space.bilibili.com/293793694
    - name: Email
      url: mailto:1052868941@qq.com
  # 是否显示 "由 Hexo 驱动"
  powered: true

# ---------------------------------------------------------------------------
# 动效
# ---------------------------------------------------------------------------
motion:
  # 滚动进入视口的渐显动画
  reveal: true
  # 首屏文字错峰入场
  stagger: true
  # 卡片悬停的动效强度：subtle / normal
  level: normal
